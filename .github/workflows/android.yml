
name: Build Faridganj Upazila Android App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > app/release-keystore.jks
          test -s app/release-keystore.jks

      - name: Build Signed APK and AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          gradle --no-daemon assembleDebug assembleRelease bundleRelease

      - name: Rename Release APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/Faridganjapp.apk

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FaridganjUpazila-APK-AAB
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/Faridganjapp.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Faridganj Upazila App v1.0.${{ github.run_number }}
          body: |
            Faridganj Upazila Android App

            New version available.

            Download Faridganjapp.apk to update the application.
            AAB file is provided for Google Play Store.
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/Faridganjapp.apk
            app/build/outputs/bundle/release/*.aab
