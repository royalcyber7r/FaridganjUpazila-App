
name: Generate Faridganj Signing Key

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Keystore
        run: |
          keytool -genkeypair \
            -keystore faridganj-release.jks \
            -storepass "${{ secrets.KEYSTORE_PASSWORD || 'TempFaridganj2026!' }}" \
            -keypass "${{ secrets.KEYSTORE_PASSWORD || 'TempFaridganj2026!' }}" \
            -alias faridganj \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Faridganj Upazila, OU=IT, O=RoyalCyber, L=Faridganj, ST=Chandpur, C=BD"

      - name: Export Keystore
        uses: actions/upload-artifact@v4
        with:
          name: Faridganj-Signing-Key
          path: faridganj-release.jks
          retention-days: 1
