name: Generate Faridganj Signing Key

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Validate GitHub Secrets
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_PASSWORD" || (echo "KEYSTORE_PASSWORD is missing" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "KEY_PASSWORD is missing" && exit 1)
          test -n "$KEY_ALIAS" || (echo "KEY_ALIAS is missing" && exit 1)

      - name: Generate Keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          keytool -genkeypair -v \
            -keystore faridganj-release.jks \
            -storetype JKS \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Faridganj Upazila, OU=IT, O=RoyalCyber, L=Faridganj, ST=Chandpur, C=BD"

          test -s faridganj-release.jks

      - name: Convert Keystore to Base64
        run: |
          base64 -w 0 faridganj-release.jks > keystore-base64.txt
          test -s keystore-base64.txt

      - name: Verify Keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          keytool -list \
            -keystore faridganj-release.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS"

      - name: Upload Keystore Files
        uses: actions/upload-artifact@v4
        with:
          name: Faridganj-Signing-Key-Base64
          path: |
            faridganj-release.jks
            keystore-base64.txt
          if-no-files-found: error
          retention-days: 1
